{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Registration Form</title>

    <link
        rel="stylesheet"
        href="{% static 'registration/style.css' %}"
    >

</head>

<body>

    <div class="container">

        <h1>Registration Form</h1>

        <p class="subtitle">
            Please fill the details carefully
        </p>


        <form
            id="registrationForm"
            enctype="multipart/form-data"
        >

            {% csrf_token %}


            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                required
            >


            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email address"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                required
            >

            <label for="phone">
                Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                name="phone_number"
                placeholder="Enter your 10-digit phone number"
                required
            >

            <label for="address">
                Address
            </label>

            <textarea
                id="address"
                name="address"
                placeholder="Enter your complete address"
                required
            ></textarea>

            <label for="dob">
                Date of Birth
            </label>

            <input
                type="date"
                id="dob"
                name="dob"
                required
            >

            <label for="website">
                Website
            </label>

            <input
                type="url"
                id="website"
                name="website"
                placeholder="https://example.com"
                required
            >

            <label for="state">
                State
            </label>

            <select
                id="state"
                name="state"
                required
            >

                <option value="">
                    Select your state
                </option>

                <option value="Tamil Nadu">
                    Tamil Nadu
                </option>

                <option value="Kerala">
                    Kerala
                </option>

                <option value="Karnataka">
                    Karnataka
                </option>

                <option value="Andhra Pradesh">
                    Andhra Pradesh
                </option>

                <option value="Telangana">
                    Telangana
                </option>

                <option value="Maharashtra">
                    Maharashtra
                </option>

                <option value="Delhi">
                    Delhi
                </option>

                <option value="Other">
                    Other
                </option>

            </select>

            <label for="languages">
                Languages
            </label>

            <select
                id="languages"
                name="languages"
                multiple
                required
            >

                <option value="Tamil">
                    Tamil
                </option>

                <option value="English">
                    English
                </option>

                <option value="Hindi">
                    Hindi
                </option>

                <option value="Telugu">
                    Telugu
                </option>

                <option value="Malayalam">
                    Malayalam
                </option>

                <option value="Kannada">
                    Kannada
                </option>

            </select>

            <small>
                Select the languages you know
            </small>

            <fieldset class="field-group">

                <legend>
                    Gender
                </legend>

                <div class="radio-group">

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="Male"
                        >
                        Male
                    </label>


                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="Female"
                        >
                        Female
                    </label>


                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="Other"
                        >
                        Other
                    </label>

                </div>

            </fieldset>

            <fieldset class="field-group">

                <legend>
                    Skills
                </legend>

                <div class="checkbox-group">

                    <label>
                        <input
                            type="checkbox"
                            name="skills"
                            value="Java"
                        >
                        Java
                    </label>


                    <label>
                        <input
                            type="checkbox"
                            name="skills"
                            value="Python"
                        >
                        Python
                    </label>


                    <label>
                        <input
                            type="checkbox"
                            name="skills"
                            value="JavaScript"
                        >
                        JavaScript
                    </label>


                    <label>
                        <input
                            type="checkbox"
                            name="skills"
                            value="SQL"
                        >
                        SQL
                    </label>


                    <label>
                        <input
                            type="checkbox"
                            name="skills"
                            value="React"
                        >
                        React
                    </label>


                    <label>
                        <input
                            type="checkbox"
                            name="skills"
                            value="Django"
                        >
                        Django
                    </label>

                </div>

            </fieldset>

            <label for="experience">
                Experience
            </label>

            <div class="range-container">

                <input
                    type="range"
                    id="experience"
                    name="experience"
                    min="0"
                    max="10"
                    value="0"
                >

                <span id="experienceValue">
                    0
                </span>

                <span>
                    years
                </span>

            </div>


            <label for="photo">
                Profile Photo
            </label>

            <input
                type="file"
                id="photo"
                name="photo"
                accept="image/jpeg,image/png,image/webp"
                required
            >

            <label for="resume">
                Resume
            </label>

            <input
                type="file"
                id="resume"
                name="resume"
                accept=".pdf,application/pdf"
                required
            >

            <label for="audio">
                Audio
            </label>

            <input
                type="file"
                id="audio"
                name="audio"
                accept="audio/*"
            >

            <label for="video">
                Video
            </label>

            <input
                type="file"
                id="video"
                name="video"
                accept="video/*"
            >

            <button type="submit">
                Register
            </button>

        </form>

    </div>

    <footer>
        Fill the details carefully
    </footer>


    <script src="{% static 'registration/script.js' %}"></script>

</body>

</html>
